name: Sync requirements.txt
# requirements.txt is a generated export of uv.lock, consumed by Elastic
# Beanstalk at deploy time (pip install -r requirements.txt). uv.lock is the
# single source of truth: CI installs from it (uv sync --locked) and this export
# is what deploys, so the two must never diverge.
#
# This workflow regenerates the export on Dependabot branches and commits it
# back to the PR. It triggers on requirements.txt as well as the lock inputs,
# so that a direct edit to a pin -- as in #366, where Dependabot bumped
# websockets past the cap langgraph-sdk imposes on it and produced a file pip
# refused to install -- is overwritten by a correct, fully-resolved export.
#
# Human-authored branches are not auto-committed to; the requirements-sync job
# in cicd.yml fails their PR instead, so the regeneration stays reviewable.

on:
  push:
    branches:
      - "dependabot/**"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"

      # Must be `uv export`, not `uv pip compile`. `uv pip compile pyproject.toml`
      # performs a FRESH resolution from the pyproject constraints, picking
      # whatever is newest at run time and ignoring uv.lock entirely -- which is
      # how requirements.txt drifted 43 packages away from the lock, so that CI
      # (uv sync --locked) and production tested different dependency sets.
      # --frozen makes the export fail rather than silently re-lock if
      # pyproject.toml and uv.lock disagree.
      - name: Regenerate requirements.txt from uv.lock
        run: uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- requirements.txt; then
            echo "requirements.txt already in sync; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: regenerate requirements.txt from uv.lock"
          git push
