# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies are managed by uv via pyproject.toml + uv.lock.
  # The "uv" ecosystem performs a full resolution, so transitive pins stay
  # consistent. requirements.txt is a generated export consumed by Elastic
  # Beanstalk; it is regenerated automatically by the sync-requirements
  # workflow whenever Dependabot changes uv.lock or pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # websockets is a purely transitive dependency, capped by langgraph-sdk
      # (0.4.2 requires "websockets<16,>=14"). Dependabot bumped the pin to
      # 17.0.1 in #366 without re-resolving, producing a requirements.txt that
      # pip refuses to install and which broke the dev deploy. No forward
      # resolution exists while the cap stands -- 0.4.2 is the latest release.
      # Remove this ignore once langgraph-sdk lifts the constraint.
      - dependency-name: "websockets"
    groups:
      # Collapse routine minor/patch bumps into a single PR to reduce noise.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the GitHub Actions used in CI up to date as well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
